name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          # Restore debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare .env from .env.example if missing
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          fi

          # Generate gradle wrapper if not present
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace || echo "::warning::Unit tests had issues or downloaded SDK timed out, proceeding to APK build"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromahunt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
